<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match asilo-casa</title>
<style>
  :root{--bg:#f8f9fa;--surface:#fff;--border:#dee2e6;--text:#212529;--muted:#6c757d;--accent:#1a6fc4;}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;}}
  :root[data-theme="dark"]{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;}
  header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:2px solid var(--border);}
  header h1{font-size:16px;font-weight:700;color:var(--accent);}
  .home-btn{padding:3px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:11px;text-decoration:none;}
  .home-btn:hover{border-color:var(--accent);color:var(--accent);}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px;text-align:center;color:var(--muted);}
</style>
</head>
<body>
<header>
  <a href="/" class="home-btn" title="Torna alla home">🏠 Home</a>
  <h1>Match asilo-casa</h1>
</header>
<main><p>Pagina in arrivo.</p></main>
</body>
</html>
