<style>
  :root{
    --bg:#f8f9fa;--surface:#fff;--border:#dee2e6;--text:#212529;--muted:#6c757d;
    --accent:#1a6fc4;--accent-l:#e8f0fb;
    --c-card:#fff;--c-border:#dee2e6;--c-text:#212529;--c-muted:#6c757d;--c-accent:#1a6fc4;
    --green:#198754;--green-l:#d1e7dd;
    --yellow:#856404;--yellow-l:#fff3cd;
    --red:#842029;--red-l:#f8d7da;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
    --accent:#58a6ff;--accent-l:#0d2149;
    --c-card:#161b22;--c-border:#30363d;--c-text:#e6edf3;--c-muted:#8b949e;--c-accent:#58a6ff;
    --green:#3fb950;--green-l:#0d2b1a;--yellow:#d29922;--yellow-l:#2d1e0f;--red:#f85149;--red-l:#2d0f0f;
  }}
  :root[data-theme="dark"]{
    --bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;
    --accent:#58a6ff;--accent-l:#0d2149;
    --c-card:#161b22;--c-border:#30363d;--c-text:#e6edf3;--c-muted:#8b949e;--c-accent:#58a6ff;
    --green:#3fb950;--green-l:#0d2b1a;--yellow:#d29922;--yellow-l:#2d1e0f;--red:#f85149;--red-l:#2d0f0f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.4;}
  /* page header */
  #page-hdr{flex-shrink:0;background:var(--surface);border-bottom:2px solid var(--border);z-index:100;}
  .header{padding:8px 14px 7px;}
  .header-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .header-top h1{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap;}
  .header-top h1 span{font-size:10px;font-weight:400;color:var(--muted);margin-left:5px;}
  .home-btn{padding:3px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:11px;white-space:nowrap;text-decoration:none;}
  .home-btn:hover{border-color:var(--accent);color:var(--accent);}
  .theme-btn{margin-left:auto;padding:3px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);cursor:pointer;font-size:11px;white-space:nowrap;}
  .controls{display:flex;gap:5px;flex-wrap:wrap;}
  .controls input,.controls select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px;outline:none;}
  .controls input:focus,.controls select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-l);}
  .controls input{flex:1;min-width:120px;}
  .stats{padding:3px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);}
  .stats b{color:var(--text);}
  /* panels */
  #main-panels{flex:1;display:flex;overflow:hidden;}
  .panel{display:flex;flex-direction:column;flex:1;overflow:hidden;border-right:1px solid var(--border);min-width:0;}
  .panel:last-child{border-right:none;}
  .panel.collapsed{flex:0 0 auto;}
  .panel-hdr{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--surface);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;}
  .panel-hdr:hover{background:var(--accent-l);}
  .ph-count{color:var(--muted);font-weight:400;font-size:11px;}
  .ph-toggle{margin-left:auto;color:var(--muted);font-size:10px;transition:transform .2s;display:inline-block;}
  .panel.collapsed .ph-toggle{transform:rotate(-90deg);}
  .panel-body{flex:1;overflow-y:auto;overflow-x:auto;}
  .panel.collapsed .panel-body{display:none;}
  /* table */
  table{width:100%;border-collapse:collapse;}
  thead{background:var(--surface);position:sticky;top:0;z-index:50;}
  thead th{padding:5px 8px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;}
  thead th:hover,thead th.sorted{color:var(--accent);}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:hover{background:var(--accent-l);}
  td{padding:4px 8px;vertical-align:middle;}
  .nome a{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px;}
  .nome a:hover{text-decoration:underline;}
  .badge18{display:inline-block;padding:0 4px;border-radius:20px;font-size:9px;font-weight:700;background:var(--green-l);color:var(--green);margin-left:3px;}
  .ind{font-size:11px;color:var(--muted);max-width:180px;}
  .cap-pill{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:600;background:var(--accent-l);color:var(--accent);}
  .zona-txt{font-size:10px;color:var(--muted);display:block;margin-top:1px;}
  .tel a{color:var(--text);text-decoration:none;font-size:11px;}
  .tel a:hover{color:var(--accent);}
  .o-pill{display:inline-block;padding:1px 6px;border-radius:12px;font-size:10px;font-weight:600;white-space:nowrap;}
  .o-late{background:var(--green-l);color:var(--green);}
  .o-mid{background:var(--yellow-l);color:var(--yellow);}
  .o-early{background:var(--red-l);color:var(--red);}
  .o-unk{background:var(--border);color:var(--muted);}
  .tipo-tag{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:500;background:var(--accent-l);color:var(--accent);}
  .empty{text-align:center;padding:32px;color:var(--muted);}
  @media(max-width:700px){#main-panels{flex-direction:column;}.hm{display:none;}}
</style>
</head>
<body>
<div id="page-hdr">
  <div class="header">
    <div class="header-top">
      <a href="/" class="home-btn" title="Torna alla home">🏠 Home</a>
      <h1>🍼 Asili Nido Milano <span>bambinopoli.it + happychild.it</span></h1>
      <button class="theme-btn" onclick="toggleTheme()">🌙 Tema</button>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="🔍 Nome o indirizzo…" oninput="render()">
      <select id="fO" onchange="render()">
        <option value="">Tutti gli orari</option>
        <option value="1830">✅ Chiude ≥ 18:30</option>
        <option value="1900">⭐ Chiude ≥ 19:00</option>
        <option value="1800">Chiude ≥ 18:00</option>
      </select>
      <select id="fZ" onchange="render()"><option value="">Tutte le zone / CAP</option></select>
      <select id="fT" onchange="render()">
        <option value="">Tutti i tipi</option>
        <option value="privato">Privato</option>
        <option value="micronido">Micronido</option>
        <option value="nido famiglia">Nido famiglia</option>
        <option value="convenzionato">Convenzionato</option>
        <option value="aziendale">Aziendale</option>
        <option value="lingua">In lingua</option>
      </select>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</div>

<div id="main-panels">
  <!-- LISTA PANEL -->
  <div class="panel" id="panel-lista">
    <div class="panel-hdr" onclick="togglePanel('panel-lista')">
      📋 Lista <span class="ph-count" id="ph-lista-count"></span>
      <span class="ph-toggle">▾</span>
    </div>
    <div class="panel-body">
      <table><thead><tr>
        <th onclick="sb('nome')">Nome ↕</th>
        <th onclick="sb('ind')">Indirizzo ↕</th>
        <th onclick="sb('cap')" class="hm">Zona / CAP ↕</th>
        <th>Telefono</th>
        <th onclick="sb('orario')">Orario ↕</th>
        <th onclick="sb('tipo')" class="hm">Tipo ↕</th>
        <th onclick="sb('email')" class="hm">Email ↕</th>
      </tr></thead><tbody id="tbody"></tbody></table>
      <div class="empty" id="empty" style="display:none">Nessun risultato con questi filtri.</div>
    </div>
  </div>
  <!-- MAPPA PANEL -->
  <div class="panel" id="panel-mappa">
    <div class="panel-hdr" onclick="togglePanel('panel-mappa')">
      🗺️ Mappa <span class="ph-count" id="ph-mappa-count"></span>
      <span class="ph-toggle">▾</span>
    </div>
    <div class="panel-body" style="display:flex;flex-direction:column;overflow:hidden;">
      <div id="map" style="flex:1;min-height:240px;"></div>
      <div style="flex-shrink:0;max-height:220px;overflow-y:auto;border-top:1px solid var(--border);padding:8px 10px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
          <button onclick="openGMaps()" style="background:var(--accent);color:#fff;border:none;padding:5px 14px;font-size:.75rem;font-weight:700;border-radius:6px;cursor:pointer;">
            🗺️ Apri <span id="gm-count">tutti i</span> nidi su Google Maps ↗
          </button>
        </div>
        <div id="gm-list" style="display:grid;gap:4px;"></div>
      </div>
    </div>
  </div>
</div>

// pre-compute CAP
const capCnt={};
DATA.forEach(d=>{
  const m=d.ind.match(/\b(20\d{3})\b/);
  d.cap=m?m[1]:'20100';
  d.zona=CZ[d.cap]||'Milano';
});

// zona dropdown
const fZsel=document.getElementById('fZ');
[...new Set(DATA.map(d=>d.cap))].sort().forEach(cap=>{
  const o=document.createElement('option');
  o.value=cap; o.textContent=cap+' — '+(CZ[cap]||'Milano');
  fZsel.appendChild(o);
});

// orario helpers
function pC(s){
  if(!s||s==='—')return null;
  const a=[...s.matchAll(/(\d{1,2})[:\.](\d{2})/g)];
  if(!a.length)return null;
  const L=a[a.length-1]; return +L[1]*60+ +L[2];
}
function oCls(s){const c=pC(s);if(c===null)return'o-unk';if(c>=18*60+30)return'o-late';if(c>=18*60)return'o-mid';return'o-early';}
function isL(s,m){const c=pC(s);return c!==null&&c>=m;}
function oCol(s){const c=pC(s);if(c===null)return'#999';if(c>=18*60+30)return'#198754';if(c>=18*60)return'#b8860b';return'#dc3545';}

// sort
let sC='orario',sD=-1;
function sb(c){
  sD=sC===c?-sD:-1; sC=c;
  document.querySelectorAll('thead th').forEach(t=>t.classList.remove('sorted'));
  event.currentTarget.classList.add('sorted');
  render();
}

function filtered(){
  const q=document.getElementById('q').value.toLowerCase();
  const fo=document.getElementById('fO').value;
  const fz=document.getElementById('fZ').value;
  const ft=document.getElementById('fT').value.toLowerCase();
  return DATA.filter(d=>{
    if(q&&!d.nome.toLowerCase().includes(q)&&!d.ind.toLowerCase().includes(q))return false;
    if(fo==='1830'&&!isL(d.orario,18*60+30))return false;
    if(fo==='1900'&&!isL(d.orario,19*60))return false;
    if(fo==='1800'&&!isL(d.orario,18*60))return false;
    if(fz&&d.cap!==fz)return false;
    if(ft&&!d.tipo.toLowerCase().includes(ft))return false;
    return true;
  });
}

// LISTA render
function render(){
  let rows=filtered();
  rows.sort((a,b)=>{
    let va=a[sC]||'',vb=b[sC]||'';
    if(sC==='orario'){va=pC(va)||0;vb=pC(vb)||0;return(va-vb)*sD;}
    return String(va).localeCompare(String(vb),'it')*sD;
  });
  const n18=rows.filter(d=>isL(d.orario,18*60+30)).length;
  document.getElementById('stats').innerHTML=`<b>${rows.length}</b> nidi su <b>${DATA.length}</b> — <b>${n18}</b> chiudono ≥ 18:30`;
  document.getElementById('empty').style.display=rows.length?'none':'block';
  document.getElementById('tbody').innerHTML=rows.map(d=>{
    const b18=isL(d.orario,18*60+30)?'<span class="badge18">✅18:30+</span>':'';
    const tel=d.tel&&d.tel!=='—'?`<a href="tel:${d.tel.replace(/\D/g,'')}">${d.tel}</a>`:(d.tel||'—');
    const email=d.email?`<a href="mailto:${d.email}" style="color:var(--accent);font-size:10px;word-break:break-all">${d.email}</a>`:'<span style="color:var(--muted);font-size:10px">—</span>';
    return`<tr>
      <td class="nome"><a href="${d.url}" target="_blank">${d.nome}</a>${b18}</td>
      <td class="ind">${d.ind}</td>
      <td class="hm"><span class="cap-pill">${d.cap}</span><span class="zona-txt">${d.zona}</span></td>
      <td class="tel">${tel}</td>
      <td><span class="o-pill ${oCls(d.orario)}">${d.orario||'—'}</span></td>
      <td class="hm"><span class="tipo-tag">${d.tipo||'—'}</span></td>
      <td class="hm">${email}</td>
    </tr>`;
  }).join('');
  // update panel header count
  const phc=document.getElementById('ph-lista-count');
  if(phc) phc.textContent='('+rows.length+')';
  // refresh mappa if visible
  const mp=document.getElementById('panel-mappa');
  if(mp && !mp.classList.contains('collapsed')){
    renderGMList();
    updateMapMarkers(rows);
  }
}

// MAP — Google Maps
let map=null,markers=[];
function openGMaps(){
  const rows=filtered();
  const q=rows.length?'asili+nido+privati+Milano':'asili+nido+Milano';
  window.open('https://www.google.com/maps/search/'+q+'/@45.464,9.190,13z','_blank');
}

function renderGMList(){
  const rows=filtered();
  const cnt=document.getElementById('gm-count');
  if(cnt) cnt.textContent=rows.length;
  const el=document.getElementById('gm-list');
  if(!el) return;
  const phm=document.getElementById('ph-mappa-count');
  if(phm) phm.textContent='('+rows.length+')';
  el.innerHTML=rows.map(d=>{
    const gm='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.ind);
    const color=oCol(d.orario);
    return`<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface);border-radius:6px;border:1px solid var(--border)">
      <div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:.8rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.nome}</div>
        <div style="font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.ind}</div>
      </div>
      <a href="${gm}" target="_blank" style="color:var(--accent);font-size:.75rem;white-space:nowrap;text-decoration:none;font-weight:700;flex-shrink:0">↗ Maps</a>
    </div>`;
  }).join('');
}


// ── MAPPA LEAFLET ────────────────────────────────────────────────────────────
let leafMap=null,leafMarkers=[];

function initMap(){
  if(leafMap||typeof L==='undefined') return;
  leafMap=L.map('map').setView([45.464,9.190],12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Tiles &copy; <a href="https://www.esri.com">Esri</a> &mdash; Source: Esri, DeLorme, NAVTEQ, TomTom',
    maxZoom:19
  }).addTo(leafMap);
}

function updateMapMarkers(rows){
  if(!leafMap) return;
  leafMarkers.forEach(m=>leafMap.removeLayer(m));
  leafMarkers=[];
  rows.forEach((d,i)=>{
    const coords=CC[d.cap];
    if(!coords) return;
    // deterministic jitter so same nursery always lands at same spot
    const jLat=((i*7+3)%11-5)*0.00035;
    const jLng=((i*11+7)%13-6)*0.00035;
    const color=oCol(d.orario);
    const icon=L.divIcon({
      className:'',
      html:`<div style="width:10px;height:10px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>`,
      iconSize:[10,10],iconAnchor:[5,5]
    });
    const gm='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.ind);
    const tel=d.tel&&d.tel!=='—'?`<div style="font-size:11px;color:var(--muted)">📞 <a href="tel:${d.tel.replace(/\D/g,'')}" style="color:var(--accent)">${d.tel}</a></div>`:'';
    const emailP=d.email?`<div style="font-size:11px;color:var(--muted);margin-top:2px">✉️ <a href="mailto:${d.email}" style="color:var(--accent)">${d.email}</a></div>`:'';
    const popup=`<div style="min-width:180px">
      <div style="font-weight:700;font-size:13px;margin-bottom:3px">${d.nome}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:5px">${d.ind}</div>
      <span class="o-pill ${oCls(d.orario)}" style="margin-bottom:5px;display:inline-block">${d.orario||'—'}</span>
      ${tel}${emailP}
      <div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">
        <a href="${gm}" target="_blank" style="background:var(--accent);color:#fff;text-decoration:none;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700">↗ Google Maps</a>
        <a href="${d.url}" target="_blank" style="border:1px solid var(--border);color:var(--text);text-decoration:none;padding:4px 10px;border-radius:5px;font-size:11px">Scheda</a>
      </div>
    </div>`;
    const m=L.marker([coords[0]+jLat,coords[1]+jLng],{icon}).bindPopup(popup);
    m.addTo(leafMap);
    leafMarkers.push(m);
  });
}

// panel collapse/expand
function togglePanel(id){
  const p=document.getElementById(id);
  p.classList.toggle('collapsed');
  if(id==='panel-mappa' && !p.classList.contains('collapsed')){
    renderGMList();
    setTimeout(()=>{
      initMap();
      if(leafMap) leafMap.invalidateSize();
      updateMapMarkers(filtered());
    },50);
  }
}

function toggleTheme(){
  const r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
}

render();
// init map after DOM is ready (both panels visible by default)
setTimeout(()=>{
  initMap();
  if(leafMap){
    leafMap.invalidateSize();
    updateMapMarkers(filtered());
  }
},100);
</script>
